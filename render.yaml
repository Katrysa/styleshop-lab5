services:
  - type: web
    name: styleshop
    runtime: node
    plan: free
    buildCommand: "echo no build"
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: TRUST_PROXY
        value: "1"
      - key: DB_PATH
        value: /tmp/styleshop.db
      - key: ADMIN_TOKEN
        sync: false
